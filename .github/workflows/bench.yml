name: bench

on:
  pull_request:
    # Trigger only on changes that can plausibly affect bench output.
    # `grafo/**` / `goap-planner/**` would also fire on README, docs/,
    # examples/, tests/, CLAUDE.md, and assets/ changes — none of which
    # influence the compiled bench binary, but each one would burn a
    # full bench run on every doc-touching PR.
    paths:
      # Source code compiled into the bench binary, the bench file
      # itself, and the per-crate manifest (dev-dep edits change what
      # links into bench).
      - 'grafo/src/**'
      - 'grafo/benches/**'
      - 'grafo/Cargo.toml'
      - 'goap-planner/src/**'
      - 'goap-planner/benches/**'
      - 'goap-planner/Cargo.toml'
      # Workspace-level files that affect dependency resolution and
      # therefore the compiled bench binary across both crates.
      - 'Cargo.toml'
      - 'Cargo.lock'
      # CI infra for the bench gate itself.
      - '.github/workflows/bench.yml'
      - '.github/scripts/detect-bench-regression.py'

env:
  CARGO_TERM_COLOR: always
  # Maximum allowed regression (percent) on the upper bound of any bench's
  # 95% confidence interval. Set high enough to absorb noise on GitHub's
  # shared runners; tighten if/when we move to dedicated bench hardware.
  REGRESSION_THRESHOLD_PCT: '10'
  # Reduced criterion sampling for CI. Defaults (3s warm-up + 5s
  # measurement × 100 samples) are calibrated for nanosecond-precision
  # research; this gate detects regressions above
  # REGRESSION_THRESHOLD_PCT, where shorter sampling is enough.
  # Per-case time drops from ~8s to ~3s. Local `cargo bench` is unaffected
  # — these flags only apply inside this workflow.
  CRITERION_CI_FLAGS: '--measurement-time 2 --warm-up-time 1 --sample-size 50'
  # Trim each multi-size bench sweep to its largest input. The largest
  # case dominates the regression signal — the smaller sizes are useful
  # locally for plotting the per-size scaling curve, but in CI they only
  # add wall time. Reduces total bench cases by ~30%. Read by
  # `ci_sample_sizes()` in each crate's `benches/performance.rs`; local
  # `cargo bench` (env unset) keeps the full sweep.
  CI_BENCH_SUBSET: '1'

jobs:
  bench:
    name: bench (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `crate` is the workspace member's *directory name* — used for the
        # baseline-availability check (`<crate>/benches/performance.rs`),
        # the `--manifest-path <crate>/Cargo.toml` cargo invocations below,
        # and the cache + artifact keys. It does not have to match the
        # crate's `[package].name` in Cargo.toml; the `grafo` directory
        # publishes as `grafo-dag` on crates.io while keeping its
        # directory name and in-source crate name. Using manifest-path
        # rather than `cargo bench -p <name>` keeps this gate stable
        # across publishing-name changes.
        crate: [grafo, goap-planner]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Need full history so we can switch to the PR base branch and
          # back without re-cloning.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key includes the crate so grafo and goap-planner jobs
          # don't fight for the same cache slot.
          key: bench-${{ matrix.crate }}

      - name: Resolve base-branch SHA
        # Fetch the current tip of the PR's base branch and surface its
        # SHA as a step output. Used downstream both as the bench
        # checkout target and as the cache key — so caches invalidate
        # naturally whenever the base branch moves.
        id: base-sha
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          sha=$(git rev-parse "origin/${{ github.base_ref }}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::Base ref ${{ github.base_ref }} resolved to $sha"

      - name: Detect base baseline availability
        # When a PR introduces the bench suite for a crate, the base
        # branch has no `benches/performance.rs` to run yet — the
        # comparison gate has nothing to compare against. Detect that
        # case here and downstream steps switch to an introductory
        # head-only run.
        id: baseline-check
        run: |
          set -euo pipefail
          if git show "${{ steps.base-sha.outputs.sha }}:${{ matrix.crate }}/benches/performance.rs" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No bench suite on origin/${{ github.base_ref }} for ${{ matrix.crate }} — this PR introduces it; comparison gate skipped."
          fi

      - name: Save base-branch baseline
        # Always run the base bench on the same runner that will run the
        # head bench, so the two measurements share heap allocator state,
        # neighbour load, and CPU model. The previous design cached the
        # base bench across PRs (key `bench-base-v3-<crate>-<sha>`) and
        # restored it from a *different* runner on cache hits — which
        # turned every cache-hit PR into a cross-machine comparison
        # against ±20-50 % runner-throughput drift. That dominated the
        # bench gate's false-positive rate; see issue #24 for the
        # analysis. Pinning same-machine comparisons here costs one
        # extra base-bench run per PR but makes every comparison
        # apples-to-apples.
        if: steps.baseline-check.outputs.available == 'true'
        run: |
          set -euo pipefail
          git checkout "${{ steps.base-sha.outputs.sha }}"
          cargo bench --manifest-path ${{ matrix.crate }}/Cargo.toml --bench performance -- \
            --save-baseline pr-base $CRITERION_CI_FLAGS 2>&1 | tee bench-base.txt

      - name: Compare PR head against baseline
        # `--baseline-lenient` (instead of `--baseline`) silently skips
        # the comparison for any HEAD bench whose name has no
        # corresponding baseline entry — for everything else the gate
        # behaves identically. Without it, criterion panics with
        # "Baseline 'pr-base' must exist before comparison is allowed"
        # the moment a PR renames or adds a bench. Renaming is a
        # legitimate move (see PR #41 for the `_x32` batching rename),
        # and the panic kills the whole comparison step rather than
        # just skipping the new bench.
        if: steps.baseline-check.outputs.available == 'true'
        run: |
          set -euo pipefail
          git checkout "${{ github.sha }}"
          cargo bench --manifest-path ${{ matrix.crate }}/Cargo.toml --bench performance -- \
            --baseline-lenient pr-base $CRITERION_CI_FLAGS 2>&1 | tee bench-head.txt

      - name: Run PR head benches (introductory, no baseline)
        # Bootstrap path: bench the PR head with no comparison. This
        # produces `bench-head.txt` so the upload-artifacts step still
        # has something to attach. Regression detection is skipped
        # because there's no baseline to regress against.
        if: steps.baseline-check.outputs.available == 'false'
        run: |
          set -euo pipefail
          cargo bench --manifest-path ${{ matrix.crate }}/Cargo.toml --bench performance -- \
            $CRITERION_CI_FLAGS 2>&1 | tee bench-head.txt

      - name: Detect regressions
        if: steps.baseline-check.outputs.available == 'true'
        # If the PR carries the `bench:allow-regression` label, the gate is
        # downgraded to a warning. Use this only for deliberate trade-offs
        # documented in the PR description and `perf-comparison-YYYY-MM-DD.md`.
        env:
          ALLOW_REGRESSION: ${{ contains(github.event.pull_request.labels.*.name, 'bench:allow-regression') }}
        run: |
          set +e
          python3 .github/scripts/detect-bench-regression.py \
            bench-head.txt "$REGRESSION_THRESHOLD_PCT"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$ALLOW_REGRESSION" = "true" ]; then
            echo "::warning::Bench regression(s) detected; bench:allow-regression label is set, downgrading to warning."
            exit 0
          fi
          exit "$rc"

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.crate }}
          path: |
            bench-base.txt
            bench-head.txt
            target/criterion/
          retention-days: 30
