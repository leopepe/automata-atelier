<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Automata Atelier — a workshop for building automatons">
  <title>Automata Atelier</title>
  <desc>A blueprint-style banner: a small geometric robot on the left, the project name in the centre rendered as serif and italic typography over a parchment background, and a directed-acyclic-graph motif on the right echoing the grafo kernel.</desc>

  <defs>
    <!-- Parchment background gradient: warm at the centre, slightly toned towards the edges -->
    <radialGradient id="parchment" cx="50%" cy="50%" r="65%">
      <stop offset="0%"  stop-color="#FAF6E9"/>
      <stop offset="80%" stop-color="#F1E9CD"/>
      <stop offset="100%" stop-color="#E5DAB6"/>
    </radialGradient>
    <!-- Subtle blueprint dot grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.7" fill="#3A3530" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#parchment)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Drafting frame (double thin border, like a technical drawing margin) -->
  <rect x="20" y="20" width="1160" height="280" fill="none" stroke="#1E3A5F" stroke-width="0.6" stroke-opacity="0.55"/>
  <rect x="28" y="28" width="1144" height="264" fill="none" stroke="#1E3A5F" stroke-width="0.4" stroke-opacity="0.4"/>

  <!-- ============================================================
       ROBOT (left) — geometric blueprint figure
       Anchored at (80, 50). Outer extent ~150×220.
       ============================================================ -->
  <g transform="translate(80,50)" stroke="#1E3A5F" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Antenna -->
    <line x1="75" y1="0"  x2="75" y2="24" stroke-width="2"/>
    <circle cx="75" cy="-3" r="5" fill="#C77F45" stroke="#1E3A5F" stroke-width="1.5"/>

    <!-- Head -->
    <rect x="38" y="24" width="74" height="56" rx="6" stroke-width="2.5"/>
    <!-- Eyes -->
    <rect x="53" y="42" width="11" height="11" rx="1" fill="#C77F45" stroke="none"/>
    <rect x="86" y="42" width="11" height="11" rx="1" fill="#C77F45" stroke="none"/>
    <!-- Mouth grille -->
    <line x1="58" y1="65" x2="92" y2="65" stroke-width="1.5"/>
    <line x1="58" y1="71" x2="92" y2="71" stroke-width="1.5"/>

    <!-- Neck -->
    <line x1="75" y1="80" x2="75" y2="92" stroke-width="2"/>
    <!-- Bolts on the neck -->
    <circle cx="68" cy="86" r="1.6" fill="#1E3A5F" stroke="none"/>
    <circle cx="82" cy="86" r="1.6" fill="#1E3A5F" stroke="none"/>

    <!-- Body -->
    <rect x="22" y="92" width="106" height="100" rx="6" stroke-width="2.5"/>

    <!-- Inside body: a tiny graph (the grafo kernel echoed inside the automaton) -->
    <g stroke="#C77F45" stroke-width="1.4">
      <line x1="48" y1="118" x2="75" y2="138"/>
      <line x1="75" y1="138" x2="102" y2="118"/>
      <line x1="48" y1="118" x2="102" y2="118"/>
      <line x1="75" y1="138" x2="75" y2="172"/>
    </g>
    <g fill="#C77F45" stroke="none">
      <circle cx="48"  cy="118" r="3.5"/>
      <circle cx="75"  cy="138" r="3.5"/>
      <circle cx="102" cy="118" r="3.5"/>
      <circle cx="75"  cy="172" r="3.5"/>
    </g>

    <!-- Arms -->
    <path d="M22 108 L0 138 L0 174" stroke-width="2.5"/>
    <circle cx="0" cy="180" r="6" fill="#1E3A5F" stroke="none"/>
    <path d="M128 108 L150 138 L150 174" stroke-width="2.5"/>
    <circle cx="150" cy="180" r="6" fill="#1E3A5F" stroke="none"/>

    <!-- Legs -->
    <line x1="55" y1="192" x2="55" y2="218" stroke-width="3"/>
    <line x1="95" y1="192" x2="95" y2="218" stroke-width="3"/>
    <line x1="44" y1="220" x2="66" y2="220" stroke-width="3.5"/>
    <line x1="84" y1="220" x2="106" y2="220" stroke-width="3.5"/>

    <!-- Tiny technical-drawing annotation: dimension tick + label -->
    <g stroke="#1E3A5F" stroke-width="0.5" stroke-opacity="0.55" fill="#1E3A5F" fill-opacity="0.55" font-family="'Courier New', monospace" font-size="8">
      <line x1="-12" y1="24" x2="-12" y2="218"/>
      <line x1="-15" y1="24" x2="-9" y2="24"/>
      <line x1="-15" y1="218" x2="-9" y2="218"/>
      <text x="-26" y="124" transform="rotate(-90,-26,124)">v0.1.0</text>
    </g>
  </g>

  <!-- ============================================================
       TYPOGRAPHY (centre) — title, ornament, tagline
       ============================================================ -->
  <g text-anchor="middle">
    <text x="600" y="140"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="76" font-weight="bold"
          fill="#1E3A5F" letter-spacing="-1">Automata</text>

    <text x="600" y="206"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="62" font-style="italic"
          fill="#C77F45">Atelier</text>

    <!-- Ornamental rule with three nodes (graph-flavoured) -->
    <g stroke="#C77F45" stroke-width="0.8">
      <line x1="430" y1="234" x2="770" y2="234"/>
    </g>
    <g fill="#C77F45" stroke="none">
      <circle cx="500" cy="234" r="3"/>
      <circle cx="600" cy="234" r="3.5"/>
      <circle cx="700" cy="234" r="3"/>
    </g>

    <text x="600" y="262"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="13" fill="#475569"
          letter-spacing="5">A WORKSHOP FOR BUILDING AUTOMATONS</text>

    <text x="600" y="284"
          font-family="'Courier New', monospace"
          font-size="11" fill="#7B6B47" letter-spacing="2">rust · goap · directed graphs · dijkstra</text>
  </g>

  <!-- ============================================================
       DIRECTED ACYCLIC GRAPH (right) — echoes the grafo kernel.
       7 nodes, source on the left, sink on the right; one path is
       slightly thickened to suggest the shortest-path result.
       ============================================================ -->
  <g transform="translate(960,80)">
    <!-- All edges (thin) -->
    <g stroke="#1E3A5F" stroke-width="1.2" fill="none" stroke-opacity="0.85">
      <line x1="10"  y1="80"  x2="70"  y2="20"/>
      <line x1="10"  y1="80"  x2="70"  y2="100"/>
      <line x1="10"  y1="80"  x2="70"  y2="160"/>
      <line x1="70"  y1="20"  x2="140" y2="60"/>
      <line x1="70"  y1="100" x2="140" y2="60"/>
      <line x1="70"  y1="100" x2="140" y2="130"/>
      <line x1="70"  y1="160" x2="140" y2="130"/>
      <line x1="140" y1="60"  x2="210" y2="90"/>
      <line x1="140" y1="130" x2="210" y2="90"/>
    </g>

    <!-- Highlighted shortest path: source → mid → mid → sink -->
    <g stroke="#C77F45" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="10"  y1="80"  x2="70"  y2="100"/>
      <line x1="70"  y1="100" x2="140" y2="130"/>
      <line x1="140" y1="130" x2="210" y2="90"/>
    </g>

    <!-- Nodes (drawn last so they sit on top of edges) -->
    <g stroke="#1E3A5F" stroke-width="1.5">
      <circle cx="10"  cy="80"  r="6.5" fill="#C77F45"/>
      <circle cx="70"  cy="20"  r="5"   fill="#FAF6E9"/>
      <circle cx="70"  cy="100" r="5"   fill="#C77F45"/>
      <circle cx="70"  cy="160" r="5"   fill="#FAF6E9"/>
      <circle cx="140" cy="60"  r="5"   fill="#FAF6E9"/>
      <circle cx="140" cy="130" r="5"   fill="#C77F45"/>
      <circle cx="210" cy="90"  r="6.5" fill="#C77F45"/>
    </g>
  </g>
</svg>
