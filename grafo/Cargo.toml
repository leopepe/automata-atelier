[package]
# `grafo` is taken on crates.io by an unrelated GPU rendering library, so
# this crate publishes as `grafo-dag`. `[lib] name = "grafo"` keeps the
# in-source crate name unchanged; consumers in this workspace alias it
# back to `grafo` via the `package =` field so source code keeps reading
# `use grafo::...`.
name = "grafo-dag"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast directed-acyclic-graph library with Dijkstra search and attribute-based path filtering. The graph kernel of the Automata Atelier workspace."
keywords = ["graph", "dag", "dijkstra", "shortest-path", "csr"]
categories = ["algorithms", "data-structures"]

[lib]
name = "grafo"

[dependencies]
rayon = "1"
rustc-hash = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance"
harness = false
